name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build

      - name: PHP format (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan, if installed)
        run: if [ -f vendor/bin/phpstan ]; then vendor/bin/phpstan analyse --no-progress; fi
      - name: TypeScript
        run: npm run types --if-present
      - name: Frontend lint
        run: npm run lint --if-present

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact
